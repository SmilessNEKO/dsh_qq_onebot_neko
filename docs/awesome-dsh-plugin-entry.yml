# 给 awesome-dsh-plugin 用的条目草稿。本文件只描述这个 fork，不代替上游条目。
#
# 上游 sj244/dsh-qq-bridge 若已上架，保留原条目即可。
# 本 fork 若单独上架，复制到 awesome-dsh-plugin 的路径应是
#     data/plugins/smilessneko__dsh_qq_onebot_neko.yml
# 规范：https://github.com/awesome-dsh-plugin/awesome-dsh-plugin/blob/main/contributing.md
#
# 分类依据：同类插件在 “Notifications & Integrations”，对应 category: notify。
# 注意：本插件没有发布到 npm（@fengye_nobug 作用域未在 registry 注册），
# 所以这里不写 npm 字段，安装地址指 GitHub Release 的 tag。
url: https://github.com/SmilessNEKO/dsh_qq_onebot_neko
name: SmilessNEKO/dsh_qq_onebot_neko
category: notify
description:
  # en 是插件市场条目的英文字段，目录规范要求保留。中文用户看 zh。
  en: DSH plugin (fork of sj244/dsh-qq-bridge, MIT) that connects DSH sessions to QQ through OneBot/NapCat. It uses its own Cordis id qq-bridge-neko, so it can coexist with the upstream plugin. Whitelist stays closed until filled in; @-mentions, nicknames and pokes always wake the model; other messages wake at a configurable probability. Not published to npm — install from the release tarball or a git tag.
  zh: 把 DSH 会话接到 QQ（OneBot/NapCat）的插件（fork 自 sj244/dsh-qq-bridge，MIT）。独立 Cordis id `qq-bridge-neko`，可与上游插件并存。白名单默认全关；被 @、叫到昵称或被戳一定叫醒，其余消息按可调概率抽样。没有发布到 npm，用 release 里的 .tgz 或 git tag 安装。
