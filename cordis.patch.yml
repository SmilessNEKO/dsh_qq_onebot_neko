# dsh-qq-bridge-neko bundle patch: one insert row carrying the whole plugin config.
# 独立发行版：Cordis id / 包名 / settings 命名空间 / API 路径 / 工具名 / state 文件名
# 全部与旧的 qq-bridge 插件不同，因此可以和它并存在同一个 profile（各自连自己的 OneBot）。
# name 是 Node 用来加载插件的包名，必须等于实际安装的 npm 包。
# 包名就是无作用域的 dsh-qq-bridge-neko（v1.1.6 起去掉 @fengye_nobug/ 前缀）；
# 写成别的名字时 Cordis 解析不到模块，qq-bridge-neko 不会挂上，/api/qq-bridge-neko/settings 就是 HTTP 404。
# 用户在 profile 的 cordis.patch.yml 里按 id 覆盖这一行；patch 会替换整份 config，
# 所以要保留的键请全部重述。覆盖里如果写了 name，也要写成同一个包名。
- insert:
    - id: qq-bridge-neko
      name: 'dsh-qq-bridge-neko'
      config:
        # 固定目标会话：QQ 的一切都注入这一个会话（保留其上下文）。
        # 留空表示不驱动任何会话。
        targetSessionId: ''
        # 可选：resume 目标会话时挂载的 agent preset（留空则沿用会话 header 里记录的）。
        agentPreset: ''
        # 状态文件（最近聊天缓冲 + 唤醒日志 + 出站目的地）。留空 = $DSH_HOME/qq-bridge-neko-state.json
        statePath: ''
        # 注册 qq_bridge_neko_status / qq_bridge_neko_send / qq_bridge_neko_transport / qq_bridge_neko_simulate
        # 四个调试工具（排障用，正式环境可关）。
        debugTools: true

        # ── M2：OneBot 传输（NapCat / go-cqhttp）─────────────────────────────
        # NapCat 的“正向 WebSocket”地址；**留空 = 完全不启用传输**（默认安全）。
        onebotUrl: ''
        # 存放 access_token 的**凭据引用名**（就是一个环境变量名），不要明文写 token。
        # 它会经 ctx.credentials 解析（进程环境 → 凭据存储 → .env），每次建连重新解析。
        # 设置方式见 README「配置」。细节在 DESIGN.md「配置 access_token」。
        accessTokenEnv: ''
        # 机器人自己的 QQ 号；留空则连上后自动调 get_login_info 获取。
        selfId: ''
        # 回复时引用触发的那条消息（[CQ:reply]）。
        replyWithQuote: false
        # 群里只有被 @ 才处理（比概率唤醒更严的一道闸门）。
        atOnlyInGroup: false
        # 出站前去掉 Markdown 标记（QQ 不渲染，留着只是噪音）。
        stripMarkdown: true
        # 多久没有任何 WS 流量就判定连接已死并重连。
        heartbeatTimeoutMs: 90000

        # ── M5：NapCat 自助托管（“一键包”体验，但不真打包）─────────────────────
        # 注意：这些只是**参数**。下载 / 安装 / 写配置一律由显式调用 qq_bridge_neko_napcat 触发，
        # 插件加载时绝不自作主张下载或安装。唯一例外是 autoStartNapcat：打开后 DSH 启动延迟
        # 若干秒只「启动已经装好的」NapCat（需先手动装好并登录过一次），不碰下载 / 安装。
        # NapCat 安装目录；留空 = $DSH_HOME/napcat
        napcatInstallDir: ''
        # 对外可打开的 NapCat WebUI。留空 = 读 webui.json（通常是 127.0.0.1，只在跑 NapCat 的机器上打得开）。
        napcatWebuiUrl: ''
        # 要装的版本 tag（如 v4.18.28）；留空 = 最新
        napcatVersion: ''
        # 下载用的 HTTP 代理。**本机直连 GitHub 不通**，走代理才行，例如
        # http://127.0.0.1:7890；留空 = 读 HTTPS_PROXY/HTTP_PROXY/ALL_PROXY 环境变量。
        downloadProxy: ''
        # 写进 NapCat 配置、并用来连的正向 WS 端口
        onebotPort: 3001
        # 快速登录用的 QQ 号（需先用 QQ 手动成功登录过一次）
        qqNumber: ''
        # DSH 启动后自动拉起已装好的 NapCat。默认 false；只启动，不下载 / 安装 / 写配置。
        autoStartNapcat: false
        # 自动启动前的等待毫秒数，默认 20000（20 秒），范围 0–600000；填 0 = 起来就立刻尝试。
        autoStartNapcatDelayMs: 20000

        # 会话怎么分：single = 所有群共用 targetSessionId；perGroup = 每个群/私聊各一条。
        sessionScope: single
        # 每个会话最多保留的最近轮数。0 = 不限制。
        maxRecentTurns: 40
        # ↓ 以下几项是 settings 命名空间 qq-bridge-neko 的默认值（设置界面可覆盖）
        nicknames: ['244', '小助手']
        # 非昵称消息的唤醒概率（5%）
        wakeProbability: 0.05
        # ⚠️ 白名单 fail-closed：留空表示任何来源都不能唤醒会话。
        # 正式使用时填入实际的 QQ openid。
        whitelist: []
        groupWhitelist: []
        # 哪些 QQ 号能在 QQ 里用「白名单」命令改群白名单。留空 = 谁都不能用。
        ownerWhitelist: []
        # 启动时向 GitHub 检查一次有没有新版本。默认关。只写日志，不自动安装。
        checkUpdateOnStart: false
